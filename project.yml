name: NaturalDSLRCamera
options:
  bundleIdPrefix: com.facu.camera
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO

targets:
  NaturalDSLRCamera:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: NaturalDSLRCamera
    info:
      path: NaturalDSLRCamera/Info.plist
      properties:
        CFBundleDisplayName: "Natural DSLR"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Acceso directo al sensor de 12MP para capturar Bayer RAW de exposición única sin procesado artificial."
        NSPhotoLibraryAddUsageDescription: "Permite guardar las fotografías reveladas con grano natural y los archivos DNG en tu fototeca."
        NSPhotoLibraryUsageDescription: "Permite mostrar la vista previa de las fotografías capturadas."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.facu.camera.naturaldslr
        INFOPLIST_FILE: NaturalDSLRCamera/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
